[package]
name = "agentum-desktop"
version.workspace = true
# Pinned to 2021 (not the workspace 2024 default): the Tauri backend targets
# edition 2021, so this avoids an edition-migration pass on ~50 modules.
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "agentum desktop — the React/Tauri IDE."

[lib]
name = "agentum_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "agentum-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Embedded backend: the desktop boots agentum-server in-process (loopback) so
# the webview drives the same HTTP/WS core as the TUI instead of a parallel one.
agentum-server = { workspace = true }
agentum-store = { workspace = true }
agentum-core = { workspace = true }
agentum-tmux = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
# `unstable` enables multiwebview (Window::add_child) — the native in-window
# browser pane embeds one child webview per browser page.
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# In-app auto-update: checks a signed `latest.json`, downloads the platform
# bundle, and swaps the app in place (the no-more-manual-DMG-dance fix).
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
portable-pty = "0.9"
base64 = "0.22"
# PNG-encode the clipboard's RGBA pixels when a screenshot is pasted into an
# agent terminal (commands/ui.rs). A lean encoder is all we need — RGBA8 → PNG,
# not the full `image` crate's codec zoo.
png = "0.18"
notify = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
which = "7"
parking_lot = "0.12"
crossbeam-channel = "0.5"
shlex = "1"

# On-device speech-to-text (Voice dictation). sherpa-rs wraps libsherpa-onnx;
# `download-binaries` fetches prebuilt onnxruntime/sherpa libs at build time and
# dynamically links them (copied next to the binary). `tts` is disabled — we only
# do ASR. Streaming (online) recognizers are reached through the re-exported
# `sherpa_rs_sys` FFI; offline recognizers use the safe wrappers.
# `sys` re-exports `sherpa_rs_sys` so the streaming (online) recognizer is
# reachable via raw FFI (the safe API only exposes offline recognizers).
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries", "sys"] }
# Native microphone capture for dictation. macOS WKWebView does not expose
# navigator.mediaDevices/getUserMedia, so audio is captured in Rust (CoreAudio
# via cpal) and fed straight into the STT engine instead of through the webview.
cpal = "0.15"
# Model archive download + integrity + extraction (sherpa models ship as tar.bz2).
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.4"
futures-util = "0.3"

# macOS Computer Use permission probing: CGPreflight/RequestScreenCaptureAccess
# (screen recording) lives in core-graphics behind the `link` feature; the
# Accessibility (AX) grant is read/requested via a direct ApplicationServices FFI
# in commands/permissions.rs. core-foundation builds the options dict required by
# AXIsProcessTrustedWithOptions — the call that registers the app in the
# Accessibility list and shows the system prompt. Pin to 0.10 to match the
# core-foundation-sys that core-graphics 0.25 links against.
[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# `elcapitan` exposes CGEvent::post_to_pid — computer-use types/keys into a
# specific target app by pid rather than only the frontmost window.
core-graphics = { version = "0.25", features = ["link", "elcapitan"] }
core-foundation = "0.10"
# Raw Objective-C messaging for the WKWebView `_setOverrideDeviceScaleFactor:`
# SPI used by browser_native.rs to keep the in-app browser sharp on Retina when
# the shipped (custom-scheme) WKWebView reports devicePixelRatio=1. Already in the
# tree via wry; pinned here so we can `use objc2` directly.
objc2 = "0.6"

[package]
name = "agentum-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native desktop shell for agentum: runs the daemon in-process on a free loopback port and opens a window on the embedded dashboard."

# A real binary now (was a placeholder lib). GUI deps (wry/tao) are isolated
# to this crate so the CLI/server release matrix is unaffected — Linux CI for
# the `agentum` binary never pulls webkit.
[[bin]]
name = "agentum-desktop"
path = "src/main.rs"

[dependencies]
agentum-server = { workspace = true }
agentum-store = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
wry = "0.45"
tao = "0.30"

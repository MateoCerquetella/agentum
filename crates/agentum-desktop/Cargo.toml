[package]
name = "agentum-desktop"
version.workspace = true
# Pinned to 2021 (not the workspace 2024 default): the Tauri backend targets
# edition 2021, so this avoids an edition-migration pass on ~50 modules.
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "agentum desktop — the React/Tauri IDE."

[lib]
name = "agentum_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "agentum-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
portable-pty = "0.9"
git2 = "0.20"
base64 = "0.22"
notify = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
which = "7"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[package]
name = "agentum-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native desktop shell for agentum: runs the daemon in-process on a free loopback port and opens a Tauri window on the embedded dashboard."

# A real binary (was a placeholder lib). The GUI deps (tauri → wry/webkit) are
# isolated to this crate so the CLI/server release matrix is unaffected — the
# Linux build of the `agentum` binary never pulls webkit.
[[bin]]
name = "agentum-desktop"
path = "src/main.rs"

[build-dependencies]
# Runs Tauri's compile-time codegen (reads tauri.conf.json, embeds the window
# icon + the placeholder frontendDist). Required even though we navigate to an
# external in-process URL at runtime.
tauri-build = { version = "2", features = [] }

[dependencies]
agentum-server = { workspace = true }
agentum-store = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
# Tauri replaces the previous raw wry+tao shell. Tray icon, native menu,
# notifications and the updater are added in Phase D; Phase A is the bare
# window-over-in-process-daemon migration.
# `devtools` keeps WebviewWindow::{open,close,is}_devtools available in
# release builds (they're cfg'd to debug_assertions OR this feature). Without
# it the "Toggle DevTools" menu item fails to compile under --release — which
# is what broke the v0.10.6 release on the macOS runner.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
# No `tauri-plugin-updater`: the updater needs a `pubkey` in tauri.conf.json
# plus a release-signing pipeline we don't have yet. Half-configured, it made
# the app fail to build and the window never opened. Re-add as a unit when
# auto-update is ready (plugin + config `pubkey` + CI signing).
tauri-plugin-window-state = "2"
# Native OS notifications + a WS subscriber to the daemon's /api/events bus
# (Phase D notification bridge). tokio-tungstenite is pinned to match the
# version agentum-server already pulls in, avoiding a duplicate in the tree.
tauri-plugin-notification = "2"
tokio-tungstenite = "0.29"
futures-util = "0.3"
clap = { workspace = true }
serde_json = { workspace = true }

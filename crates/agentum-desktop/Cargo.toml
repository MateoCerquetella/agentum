[package]
name = "agentum-desktop"
version.workspace = true
# Pinned to 2021 (not the workspace 2024 default): the Tauri backend targets
# edition 2021, so this avoids an edition-migration pass on ~50 modules.
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "agentum desktop — the React/Tauri IDE."

[lib]
name = "agentum_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "agentum-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Embedded backend: the desktop boots agentum-server in-process (loopback) so
# the webview drives the same HTTP/WS core as the TUI instead of a parallel one.
agentum-server = { workspace = true }
agentum-store = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
portable-pty = "0.9"
base64 = "0.22"
notify = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
which = "7"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# On-device speech-to-text (Voice dictation). sherpa-rs wraps libsherpa-onnx;
# `download-binaries` fetches prebuilt onnxruntime/sherpa libs at build time and
# dynamically links them (copied next to the binary). `tts` is disabled — we only
# do ASR. Streaming (online) recognizers are reached through the re-exported
# `sherpa_rs_sys` FFI; offline recognizers use the safe wrappers.
# `sys` re-exports `sherpa_rs_sys` so the streaming (online) recognizer is
# reachable via raw FFI (the safe API only exposes offline recognizers).
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries", "sys"] }
# Model archive download + integrity + extraction (sherpa models ship as tar.bz2).
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.4"
futures-util = "0.3"

# macOS Computer Use permission probing: CGPreflight/RequestScreenCaptureAccess
# (screen recording) lives in core-graphics behind the `link` feature; the
# Accessibility (AX) grant is read/requested via a direct ApplicationServices FFI
# in commands/permissions.rs. core-foundation builds the options dict required by
# AXIsProcessTrustedWithOptions — the call that registers the app in the
# Accessibility list and shows the system prompt. Pin to 0.10 to match the
# core-foundation-sys that core-graphics 0.25 links against.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["link"] }
core-foundation = "0.10"

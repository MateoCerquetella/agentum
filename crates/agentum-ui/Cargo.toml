web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "Storage", "Location", "History", "KeyboardEvent", "MouseEvent", "Event", "EventTarget", "Navigator", "Clipboard", "DomRect", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "MediaQueryList", "Notification", "NotificationPermission", "Performance", "console"] }

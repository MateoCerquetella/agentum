[package]
name = "agentum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Self-hosted control plane for AI coding agents."

[lib]
name = "agentum"
path = "src/lib.rs"

[[bin]]
name = "agentum"
path = "src/main.rs"

[[bin]]
name = "lazyagentum"
path = "src/bin/lazyagentum.rs"

[dependencies]
agentum-core      = { workspace = true }
agentum-store     = { workspace = true }
agentum-server    = { workspace = true }
agentum-tmux      = { workspace = true }
agentum-executor  = { workspace = true }
anyhow          = { workspace = true }
clap            = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
time            = { workspace = true }
toml            = { workspace = true }
toml_edit       = { workspace = true }
exec            = { workspace = true }
uuid            = { workspace = true }

# Terminal dashboard (`agentum terminal`, alias `tui`, bin `lazyagentum`)
ratatui            = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm          = { version = "0.28", features = ["event-stream"] }
tui-term           = "0.2"
vt100              = "0.15"
portable-pty       = "0.9"
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite  = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util       = "0.3"
url                = "2"
rustls             = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
bytes              = "1"
sha2               = "0.10"

# Workdir picker (`agentum new --pick`)
which              = "7"
tempfile           = "3"

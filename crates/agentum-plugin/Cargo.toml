[package]
name = "agentum-plugin"
description = "The Agentum plugin API: a manifest, a hub (server) part and a web part mounted in slots."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
hub = ["dep:async-trait"]
web = ["dep:leptos"]

[dependencies]
agentum-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }

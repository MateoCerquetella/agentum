[package]
name = "agentum-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Terminal UI for managing AI coding agents. Installs the `agentum` command."

[lib]
name = "agentum"
path = "src/lib.rs"

[[bin]]
name = "agentum"
path = "src/main.rs"

[dependencies]
agentum-core      = { workspace = true }
agentum-store     = { workspace = true }
agentum-server    = { workspace = true }
agentum-tmux      = { workspace = true }
agentum-executor  = { workspace = true }
anyhow          = { workspace = true }
thiserror       = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
time            = { workspace = true }
toml            = { workspace = true }
uuid            = { workspace = true }

# Terminal dashboard (`agentum`)
ratatui            = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm          = { version = "0.28", features = ["event-stream"] }
tui-term           = "0.2"
vt100              = "0.15"
portable-pty       = "0.9"
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword          = "7"
tokio-tungstenite  = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util       = "0.3"
url                = "2"
rustls             = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
bytes              = "1"
sha2               = "0.10"
base64             = "0.22"
getrandom          = "0.2"   # OS CSPRNG for the loopback bootstrap password

which              = "7"

# Cross-platform local clipboard reader for Ctrl-V image paste. The
# default feature set on arboard 3 already pulls `image-data`; we
# declare it explicitly so the intent is visible at the call site, and
# add `wayland-data-control` so Wayland sessions (omarchy is the
# primary dev host) get the modern protocol instead of falling back
# through XWayland. Defaults are off so we don't drag in the rest of
# arboard's optional features by accident.
arboard            = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
# PNG-encode the RGBA pixels arboard hands us. We don't decode
# arbitrary formats here, so disable defaults and only enable `png`.
# Pinning the same major series arboard 3 already depends on
# transitively keeps the dep graph from duplicating `image`.
image              = { version = "0.25", default-features = false, features = ["png"] }

[package]
name = "agentum-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "axum HTTP server for agentum."

[dependencies]
agentum-core      = { workspace = true }
agentum-store     = { workspace = true }
agentum-tmux      = { workspace = true }
agentum-executor  = { workspace = true }
agentum-watchdog  = { workspace = true }
anyhow         = { workspace = true }
thiserror      = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
axum           = { workspace = true }
tower          = { workspace = true }
tower-http     = { workspace = true }
uuid           = { workspace = true }
time           = { workspace = true }
bytes          = "1"
axum-server    = { version = "0.7", features = ["tls-rustls"] }
rcgen          = "0.13"
rand           = "0.9"
base64         = "0.22"
argon2         = "0.5"
password-hash  = { version = "0.5", features = ["getrandom"] }
sha2           = "0.10"
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
notify         = "8"
sysinfo        = { version = "0.32", default-features = false, features = ["system"] }
which          = "7"
shlex          = "1"
# Used by usage::claude_oauth to fetch `GET /api/oauth/usage` from
# Anthropic (spec 001). rustls (no native-tls) so release binaries
# don't need system OpenSSL — mirrors the feature set agentum-tui
# already pins, so the lockfile carries no new transitive deps.
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Used by planner.rs to deserialise $XDG_CONFIG_HOME/agentum/planner.toml.
# Already a workspace dep (profiles.toml, credentials.toml read by agentum-tui).
toml           = { workspace = true }
# Locate the desktop's Linear creds file (`<data_local_dir>/Agentum/linear.json`)
# for the server-side Linear task sink (spec 011c). Same crate + version the
# desktop already pins, so the lockfile carries no new transitive deps.
dirs           = "6"

[dev-dependencies]
tempfile       = "3"

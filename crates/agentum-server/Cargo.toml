[package]
name = "agentum-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "axum HTTP server for agentum."

[dependencies]
agentum-core      = { workspace = true }
agentum-store     = { workspace = true }
agentum-tmux      = { workspace = true }
agentum-executor  = { workspace = true }
agentum-watchdog  = { workspace = true }
anyhow         = { workspace = true }
thiserror      = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
axum           = { workspace = true }
tower          = { workspace = true }
tower-http     = { workspace = true }
uuid           = { workspace = true }
time           = { workspace = true }
bytes          = "1"
rayon          = "1"
axum-server    = { version = "0.8", features = ["tls-rustls"] }
rcgen          = "0.14"
rand           = "0.10"
base64         = "0.23"
argon2         = "0.5"
password-hash  = { version = "0.6", features = ["getrandom"] }
sha2           = "0.11"
ulid           = { workspace = true }
libc           = "0.2"
tempfile       = "3"
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
notify         = "8"
sysinfo        = { version = "0.39", default-features = false, features = ["system"] }
which          = "8"
shlex          = "2"
cap-primitives = "4.0.2"
# CDP-over-WebSocket client for the in-agentum screencast bridge (009c-3): connect
# to the headless CDP-Chromium, drive Page.startScreencast, dispatch Input.*/Page.*.
# Same version + features agentum-tui already pins (ws:// to loopback CDP; the TLS
# feature is shared so the lockfile carries no new transitive deps).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util   = "0.3"
# Used by usage::claude_oauth to fetch `GET /api/oauth/usage` from
# Anthropic (spec 001). rustls (no native-tls) so release binaries
# don't need system OpenSSL — mirrors the feature set agentum-tui
# already pins, so the lockfile carries no new transitive deps.
# `stream` enables `Response::bytes_stream()` — the chat route proxies Anthropic's
# token-by-token SSE through to the desktop (live streaming + extended thinking).
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# `async_stream::stream!` builds the axum SSE body that re-emits Anthropic's
# token deltas as our own `{type,text}` events (chat streaming). Tiny, no proc-macro deps.
async-stream   = "0.3"
# Used by planner.rs to deserialise $XDG_CONFIG_HOME/agentum/planner.toml.
# Already a workspace dep (profiles.toml, credentials.toml read by agentum-tui).
toml           = { workspace = true }
# host_browser's CDP client (connect to the host Chromium's DevTools WebSocket
# through the SSH -L tunnel and pump the screencast) reuses the tokio-tungstenite
# + futures-util already pinned above for staging's CDP-Chromium client — same
# crates, so the lockfile gains no new dep.
# Locate the desktop's Linear creds file (`<data_local_dir>/Agentum/linear.json`)
# for the server-side Linear task sink (spec 011c). Same crate + version the
# desktop already pins, so the lockfile carries no new transitive deps.
dirs           = "6"
keyring        = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
ring           = "0.17"
zeroize        = "1"

[dev-dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"], default-features = false }

[target.'cfg(windows)'.dependencies]
# Apply a protected, owner-only DACL to credential-bearing temporary files
# before they are atomically published.
windows-sys = { version = "0.61", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

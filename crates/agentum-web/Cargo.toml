[package]
name = "agentum-web"
description = "Agentum's web app: Leptos compiled to WebAssembly, served by the hub."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agentum-plugin-git = { path = "../../plugins/git", features = ["web"] }
agentum-plugin-pr = { path = "../../plugins/pr", features = ["web"] }
agentum-plugin-files = { path = "../../plugins/files", features = ["web"] }
agentum-plugin-editor = { path = "../../plugins/editor", features = ["web"] }
agentum-plugin-history = { path = "../../plugins/history", features = ["web"] }
agentum-plugin-terminal = { path = "../../plugins/terminal", features = ["web"] }
agentum-plugin-hover-cards = { path = "../../plugins/hover-cards", features = ["web"] }
agentum-plugin-timestamps = { path = "../../plugins/timestamps", features = ["web"] }
agentum-plugin-sticky-prompt = { path = "../../plugins/sticky-prompt", features = ["web"] }
agentum-plugin-nudger = { path = "../../plugins/nudger", features = ["web"] }
agentum-plugin-scheduled-send = { path = "../../plugins/scheduled-send", features = ["web"] }
agentum-plugin-side-chat = { path = "../../plugins/side-chat", features = ["web"] }
agentum-plugin-drafts = { path = "../../plugins/drafts", features = ["web"] }
agentum-plugin-usage = { path = "../../plugins/usage", features = ["web"] }
agentum-plugin-context = { path = "../../plugins/context", features = ["web"] }
agentum-plugin-concurrency = { path = "../../plugins/concurrency", features = ["web"] }
agentum-plugin-notify = { path = "../../plugins/notify", features = ["web"] }
agentum-plugin-aura = { path = "../../plugins/aura", features = ["web"] }
agentum-plugin-genui = { path = "../../plugins/genui", features = ["web"] }
agentum-plugin-browser = { path = "../../plugins/browser", features = ["web"] }
agentum-plugin-dockside = { path = "../../plugins/dockside", features = ["web"] }
agentum-plugin-themes = { path = "../../plugins/themes", features = ["web"] }
agentum-plugin-secrets = { path = "../../plugins/secrets", features = ["web"] }
agentum-proto.workspace = true
agentum-plugin = { workspace = true, features = ["web"] }
agentum-ui.workspace = true
leptos = { workspace = true, features = ["csr"] }
gloo-net.workspace = true
gloo-timers.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
web-sys.workspace = true
console_error_panic_hook = "0.1"
# Markdown for the Secretary's answers and the notes preview; inflate for attached Office files.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
# Mail and Today: the quick-add parser, subjects and email colours (small, no Unicode tables).
regex-lite = "0.1"
send_wrapper = "0.6"

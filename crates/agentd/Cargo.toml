[package]
name = "agentd"
description = "Agentum's machine daemon: runs coding agents (Claude Code, Codex, OpenCode), terminals, files and git on one machine, for the hub."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agentum-proto.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
toml = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"

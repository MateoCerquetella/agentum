[package]
name = "agentum-plugin-secrets"
description = "A project's .env: add, update or delete keys without showing values; agents ask for keys here, not in chat."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
hub = ["agentum-plugin/hub", "dep:async-trait"]
web = ["agentum-plugin/web", "dep:leptos", "dep:agentum-ui", "dep:web-sys"]

[dependencies]
agentum-plugin.workspace = true
agentum-proto.workspace = true
serde_json.workspace = true
async-trait = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }
agentum-ui = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

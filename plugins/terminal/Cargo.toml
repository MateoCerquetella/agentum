[package]
name = "agentum-plugin-terminal"
description = "Shells on the thread's machine, in its directory."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
hub = ["agentum-plugin/hub", "dep:async-trait", "dep:tokio"]
web = ["agentum-plugin/web", "dep:leptos", "dep:agentum-ui", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:gloo-timers", "dep:vt100"]

[dependencies]
agentum-plugin.workspace = true
agentum-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }
agentum-ui = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["ResizeObserver", "ClipboardEvent", "DataTransfer", "CompositionEvent", "InputEvent", "WheelEvent", "KeyboardEvent", "Selection", "HtmlCollection", "DomRect"] }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }
# The terminal emulator, in the browser.
vt100 = { version = "0.18", default-features = false, optional = true }

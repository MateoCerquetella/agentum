[package]
name = "agentum-plugin-browser"
description = "Each project's own browser (Surf): agents drive it, you watch it beside the thread."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
hub = ["agentum-plugin/hub", "dep:async-trait", "dep:tokio", "dep:tracing"]
web = ["agentum-plugin/web", "dep:leptos", "dep:agentum-ui", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:gloo-timers"]

[dependencies]
agentum-plugin.workspace = true
agentum-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }
agentum-ui = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["HtmlIFrameElement", "MessageEvent", "Window"] }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }

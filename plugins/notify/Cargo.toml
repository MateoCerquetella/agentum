[package]
name = "agentum-plugin-notify"
description = "A push when a thread needs you or finishes."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
hub = ["agentum-plugin/hub", "dep:async-trait", "dep:tokio", "dep:chrono"]
web = ["agentum-plugin/web", "dep:leptos", "dep:agentum-ui", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:gloo-timers"]

[dependencies]
agentum-plugin.workspace = true
agentum-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
leptos = { workspace = true, optional = true }
agentum-ui = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }

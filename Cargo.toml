[workspace]
resolver = "2"
members = [
    "crates/agentum-desktop",
    "crates/agentum-server",
    "crates/agentum-tmux",
    "crates/agentum-watchdog",
    "crates/agentum-store",
    "crates/agentum-core",
    "crates/agentum-executor",
]

[workspace.package]
version = "0.20.6"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mateocerquetella/agentum"
authors = ["Mateo Cerquetella"]

[workspace.dependencies]
agentum-core      = { path = "crates/agentum-core" }
agentum-store     = { path = "crates/agentum-store" }
agentum-tmux      = { path = "crates/agentum-tmux" }
agentum-watchdog  = { path = "crates/agentum-watchdog" }
agentum-executor  = { path = "crates/agentum-executor" }
agentum-server    = { path = "crates/agentum-server" }

anyhow            = "1"
thiserror         = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tokio             = { version = "1", features = ["full"] }
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum              = { version = "0.8", features = ["ws", "macros"] }
tower             = "0.5"
tower-http        = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
# sqlx is consumed only by agentum-store; pinned there directly with the
# `sqlite` (bundled) feature so prebuilt release binaries don't need
# system libsqlite3 headers/library.
clap              = { version = "4", features = ["derive", "env"] }
directories       = "5"
uuid              = { version = "1", features = ["v4", "serde"] }
time              = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml              = "0.8"
toml_edit         = "0.22"
exec              = "0.3"

# Tuned for CI build time over marginal runtime perf: agentum is I/O-bound
# (it proxies bytes between tmux panes, WS, and SQLite), so thin-LTO +
# codegen-units=1 cost ~2x compile time — dominant on the Windows MSVC linker —
# for a runtime gain this workload can't use. codegen-units=16 parallelizes
# codegen across runner cores; strip keeps binaries small.
[profile.release]
codegen-units = 16
strip = "symbols"

# Dependency policy for release builds. Keep this file intentionally explicit:
# new licenses, registries, Git sources, and security exceptions require review.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "warn"
# Fail if an Agentum workspace package itself becomes unmaintained. Transitive
# maintenance notices remain visible through cargo-audit without blocking on
# platform stacks that Agentum cannot replace independently.
unmaintained = "workspace"
unsound = "all"
ignore = [
  # Windows-only tauri-winrt-notification 0.7.2 calls quick_xml::escape but
  # never Reader or NsReader, the APIs affected by these advisories. The CI
  # audit script verifies the exact dependency path and expires this exception
  # on 2026-10-26. Upstream 0.8 removed quick-xml, but notify-rust still pins
  # the semver-incompatible 0.7 line.
  { id = "RUSTSEC-2026-0194", reason = "Windows notification dependency uses escape only, not the affected Reader API; expires 2026-10-26." },
  { id = "RUSTSEC-2026-0195", reason = "Windows notification dependency uses escape only, not the affected NsReader API; expires 2026-10-26." },

  # Tauri 2's Linux WebKit shell is still built on gtk-rs 0.18. The affected
  # VariantStrIter API is not used by Agentum, and moving Tauri's platform stack
  # to GTK4 cannot be performed at the application dependency layer.
  { id = "RUSTSEC-2024-0429", reason = "Uncalled gtk-rs iterator API in Tauri's upstream GTK3 platform stack." },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally inherit a shared version and appear
# wildcard-like to cargo-deny. External crates remain locked by Cargo.lock.
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

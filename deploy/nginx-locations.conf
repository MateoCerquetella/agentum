# Agentum behind nginx (or Nginx Proxy Manager's "Advanced" box): the WebSockets need their
# own locations with the upgrade headers and long timeouts; everything else is plain HTTP.
#   /agentd               — every machine's agentd (Authorization: Bearer <machine token>)
#   /api/ws               — the browser's live updates (signed in by its cookie)
#   /api/p/browser/view/  — a project's browser (Surf): its viewer page and screencast sockets
# Replace 127.0.0.1:7100 with the hub's AGENTUM_BIND.
location ^~ /agentd {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 1d;
  proxy_send_timeout 1d;
  proxy_pass http://127.0.0.1:7100;
}
location = /api/ws {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 1d;
  proxy_send_timeout 1d;
  proxy_pass http://127.0.0.1:7100;
}
location ^~ /api/p/browser/view/ {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_set_header Host $host;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 1d;
  proxy_send_timeout 1d;
  proxy_pass http://127.0.0.1:7100;
}

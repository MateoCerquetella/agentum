name: "🐞 Bug report"
description: "Report something broken. Required before opening a fix PR."
title: "fix: "
labels: ["type/fix"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What's wrong
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area(s)
      description: "Which crate(s)/surface — also add the matching area/* label."
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: agentum version, OS, tool/model in the session if relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
    validations:
      required: false

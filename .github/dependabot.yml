version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /crates/agentum-desktop/ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      desktop-ui-dependencies:
        patterns:
          - '*'

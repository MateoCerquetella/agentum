name: ci

# Runs only when we cut a release (tag push) or via manual dispatch.
# We don't gate every commit to main — keeps the Actions tab quiet.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain (not @stable) so CI's rustfmt + clippy match the
      # repo's rust-toolchain.toml and what developers run locally. @stable
      # set RUSTUP_TOOLCHAIN=stable, which overrides rust-toolchain.toml and
      # floated CI to newer, stricter tooling — turning ci red on tags the
      # author had verified green (v0.8.12 clippy, v0.8.13 fmt). Keep this in
      # lockstep with rust-toolchain.toml's channel when bumping.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # agentum-desktop (a workspace member) embeds crates/agentum-desktop/ui/dist
      # via generate_context! and links webkit2gtk on Linux at build time, so
      # `cargo test --all` can't compile it without the UI bundle and the GTK/
      # webkit dev libs. (Replaces the old dashboard/ rust-embed build, removed
      # in the thin-shell refactor.)
      - name: Install desktop build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev
      # Windows desktop build deps: MSVC (puts cl.exe on PATH) + nasm for the
      # ring/aws-lc assembly, and override the repo .cargo/config CC=/usr/bin/gcc
      # pin (a unix-only local-dev workaround) so cc-rs uses MSVC, not a missing
      # gcc.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Use MSVC compiler instead of the gcc pin (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CC=cl" >> "$GITHUB_ENV"
      # Stage the sherpa/onnxruntime native libs before clippy/test on EVERY OS.
      # sherpa-rs's `download-binaries` feature fetches the per-target prebuilts,
      # and a standalone release build of just sherpa-rs drops them where the
      # desktop crate's link step looks (target/release/) — so `cargo test --all`
      # links on Linux and Windows too, not only macOS. clippy doesn't link, so
      # it passed without this; `cargo test` does link and failed with
      # `unable to find library -lonnxruntime / -lsherpa-onnx-c-api` until this
      # step ran cross-OS. (build.rs sets the rpath: @loader_path on macOS,
      # $ORIGIN on Linux.)
      - name: Stage sherpa libs (download-binaries)
        run: cargo build --release -p sherpa-rs
      # tauri.conf.json's macOS frameworks reference target/release/lib{sherpa,onnx}*.dylib,
      # copied there by sherpa-rs-sys's build script. On a warm rust-cache that
      # build script is skipped, so the loose dylibs go missing and tauri_build
      # fails with "Library not found". Copy them from wherever they were
      # built/cached so target/release/ always has them.
      - name: Ensure sherpa dylibs sit in target/release (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Disable errexit/pipefail first: `find` can exit non-zero (e.g. a
          # transient/permission hiccup) without that meaning failure, and under
          # the default `bash -eo pipefail` that aborted the step. This is pure
          # housekeeping — stage whatever dylibs exist, never fail the job here.
          set +e +o pipefail
          dest="$PWD/target/release"
          mkdir -p "$dest"
          find "$PWD/target" \( -name 'libsherpa*.dylib' -o -name 'libonnxruntime*.dylib' \) 2>/dev/null \
            | while IFS= read -r f; do [ "$(dirname "$f")" = "$dest" ] || cp -f "$f" "$dest/"; done
          echo "Dylibs in $dest:"; ls -1 "$dest"/*.dylib 2>/dev/null || echo "(none found)"
          exit 0
      # `cargo test` links the desktop crate's onnxruntime/sherpa deps fine, but
      # the test binary's rpath ($ORIGIN = target/debug/deps/) doesn't hold the
      # .so files, so they fail to LOAD at runtime
      # (`libsherpa-onnx-c-api.so: cannot open shared object file`). Point the
      # loader at the dirs the staging step dropped them in. macOS uses
      # @loader_path and Windows resolves DLLs next to the binary, so Linux-only.
      - name: Expose sherpa libs to the dynamic loader (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dirs="$PWD/target/release"
          for so in $(find "$PWD/target" \( -name 'libsherpa*.so*' -o -name 'lib*onnxruntime*.so*' \) 2>/dev/null); do
            dirs="$(dirname "$so"):$dirs"
          done
          echo "LD_LIBRARY_PATH=$dirs:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Build desktop UI bundle (embedded via generate_context!)
        working-directory: crates/agentum-desktop/ui
        # `--bun` runs vite under bun's runtime instead of the runner's node.
        # The macOS runner's node@22 aborts (SIGABRT/exit 134) closing file
        # handles during the build, which broke every macOS release since
        # v0.11.0; bun's runtime sidesteps that node bug.
        run: bun install --frozen-lockfile && bun run --bun build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

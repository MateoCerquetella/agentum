name: ci

# Stable validation checks gate every promotion branch and release tag. The
# publishing job remains tag-only and starts only after the full matrix passes.
on:
  push:
    branches: [main, develop, staging]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  policy:
    name: release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit@0.22.2
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny@0.20.2
      - name: Install pinned Gitleaks
        run: |
          scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: shellcheck@0.11.0
      - name: Install pinned Actionlint
        run: |
          scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint-bin"
          printf '%s\n' "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Install pinned Ripgrep
        shell: bash
        run: |
          scripts/install-ripgrep.sh "$RUNNER_TEMP/ripgrep-bin"
          printf '%s\n' "$RUNNER_TEMP/ripgrep-bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: zizmor@1.28.0
      - name: Workflow policy
        run: |
          actionlint
          zizmor --pedantic .
      - name: Rust dependency policy
        run: scripts/check-rust-dependencies.sh
      - name: Secret scan of release source archive
        run: scripts/check-secrets.sh
      - name: Hard-cutover SDD runtime boundary
        run: scripts/check-no-legacy-sdd.sh
      - name: Installer asset contract
        run: |
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
          shellcheck -x scripts/*.sh tests/*.sh .github/*.sh
          bash tests/install_release_assets.sh
          bash tests/uninstall_desktop.sh
      - name: Desktop security configuration contract
        run: python3 scripts/check-desktop-security-config.py
      - name: SDD artifact, migration, and clean-fixture contracts
        run: >-
          python3 -m unittest
          tests.test_agentum_artifacts
          tests.test_sdd_migration
          tests.test_sdd_demo_fixture
          tests.test_openspec_golden
          tests.test_release_workflow
          tests.test_restricted_content_scan

  rust:
    name: rust ${{ matrix.os }}
    needs: provider-authority
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # macOS exposes /var as a system symlink to /private/var. tempfile uses
      # that path by default, which must be rejected by Agentum's no-follow
      # artifact boundary. Keep tests under GitHub's real, symlink-free path so
      # they exercise repository-controlled links rather than the host alias.
      - name: Use no-follow-safe test temp root (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned Ripgrep
        shell: bash
        run: |
          scripts/install-ripgrep.sh "$RUNNER_TEMP/ripgrep-bin"
          printf '%s\n' "$RUNNER_TEMP/ripgrep-bin" >> "$GITHUB_PATH"
      # Pin the toolchain (not @stable) so CI's rustfmt + clippy match the
      # repo's rust-toolchain.toml and what developers run locally. @stable
      # set RUSTUP_TOOLCHAIN=stable, which overrides rust-toolchain.toml and
      # floated CI to newer, stricter tooling — turning ci red on tags the
      # author had verified green (v0.8.12 clippy, v0.8.13 fmt). Keep this in
      # lockstep with rust-toolchain.toml's channel when bumping.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.94.1
      # agentum-desktop (a workspace member) embeds crates/agentum-desktop/ui/dist
      # via generate_context! and links webkit2gtk on Linux at build time, so
      # `cargo test --all` can't compile it without the UI bundle and the GTK/
      # webkit dev libs. (Replaces the old dashboard/ rust-embed build, removed
      # in the thin-shell refactor.)
      - name: Install desktop build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev
      # Ubuntu 24.04's AppArmor default blocks the unprivileged user namespace
      # that bubblewrap needs, even when the pinned package is installed. The
      # hosted runner is ephemeral and already executes this checkout; enable
      # the namespace only for this job, then prove the real sandbox starts.
      - name: Enable and probe Bubblewrap sandbox (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --die-with-parent --unshare-pid --ro-bind / / --proc /proc --dev /dev -- true
      # Windows desktop build deps: MSVC (puts cl.exe on PATH) + nasm for the
      # ring/aws-lc assembly, and override the repo .cargo/config CC=/usr/bin/gcc
      # pin (a unix-only local-dev workaround) so cc-rs uses MSVC, not a missing
      # gcc.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - name: Use MSVC compiler instead of the gcc pin (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CC=cl" >> "$GITHUB_ENV"
      # Stage the sherpa/onnxruntime native libs before clippy/test on EVERY OS.
      # sherpa-rs's `download-binaries` feature fetches the per-target prebuilts,
      # and a standalone release build of just sherpa-rs drops them where the
      # desktop crate's link step looks (target/release/) — so `cargo test --all`
      # links on Linux and Windows too, not only macOS. clippy doesn't link, so
      # it passed without this; `cargo test` does link and failed with
      # `unable to find library -lonnxruntime / -lsherpa-onnx-c-api` until this
      # step ran cross-OS. (build.rs sets the rpath: @loader_path on macOS,
      # $ORIGIN on Linux.)
      # Force sherpa-rs-sys's build script to re-run so it re-stages the sherpa-onnx +
      # onnxruntime native libs (macOS frameworks reference them in target/release/;
      # Windows links the .lib; Linux loads the .so). A warm rust-cache restores its
      # .fingerprint, so `cargo build` (and even `cargo clean -p`) skips the script and
      # the libs go missing: macOS tauri_build "Library not found", Windows link 1181,
      # Linux runtime load failure. Dropping the fingerprint + build output forces it.
      # The removal needs a bash glob, but keep it in its OWN bash step: the actual
      # build (which compiles+links sherpa-rs-sys's build script) must run in the
      # default shell. On Windows `shell: bash` puts Git's /usr/bin/link.exe ahead of
      # MSVC's link.exe on PATH, so the build script fails to link; pwsh (default) uses
      # the MSVC linker that msvc-dev-cmd put on PATH.
      - name: Drop sherpa-rs-sys fingerprint (force build-script re-run)
        shell: bash
        run: rm -rf target/release/.fingerprint/sherpa-rs-sys-* target/release/build/sherpa-rs-sys-* 2>/dev/null || true
      - name: Stage sherpa libs (download-binaries)
        run: cargo build --locked --release -p sherpa-rs
      # `cargo test` links the desktop crate's onnxruntime/sherpa deps fine, but
      # the test binary's rpath ($ORIGIN = target/debug/deps/) doesn't hold the
      # .so files, so they fail to LOAD at runtime
      # (`libsherpa-onnx-c-api.so: cannot open shared object file`). Point the
      # loader at the dirs the staging step dropped them in. macOS uses
      # @loader_path and Windows resolves DLLs next to the binary, so Linux-only.
      - name: Expose sherpa libs to the dynamic loader (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dirs="$PWD/target/release"
          while IFS= read -r -d '' so; do
            dirs="$(dirname "$so"):$dirs"
          done < <(find "$PWD/target" \( -name 'libsherpa*.so*' -o -name 'lib*onnxruntime*.so*' \) -print0 2>/dev/null)
          echo "LD_LIBRARY_PATH=$dirs:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      # Tag workflows do not restore shared dependency/toolchain caches: a
      # release is rebuilt from locked source and registry checksums.
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Build desktop UI bundle (embedded via generate_context!)
        working-directory: crates/agentum-desktop/ui
        # `--bun` runs vite under bun's runtime instead of the runner's node.
        # The macOS runner's node@22 aborts (SIGABRT/exit 134) closing file
        # handles during the build, which broke every macOS release since
        # v0.11.0; bun's runtime sidesteps that node bug.
        run: bun install --frozen-lockfile && bun run --bun build

      - name: Audit JavaScript dependencies
        if: runner.os == 'Linux'
        working-directory: crates/agentum-desktop/ui
        run: bun audit

      - name: Type-check desktop UI
        if: runner.os == 'Linux'
        working-directory: crates/agentum-desktop/ui
        run: bunx tsc --noEmit

      - name: Test every desktop UI surface
        if: runner.os == 'Linux'
        working-directory: crates/agentum-desktop/ui
        run: bunx vitest run

      - name: Check desktop entry size
        if: runner.os == 'Linux'
        working-directory: crates/agentum-desktop/ui
        run: bun run check:entry-size

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: SDD repository boundary
        shell: bash
        run: scripts/check-sdd-boundary.sh --boundary-only

      - name: Release restricted-content boundary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RESTRICTED_PATTERNS: ${{ secrets.AGENTUM_RESTRICTED_PATTERNS }}
        run: |
          set -euo pipefail
          if [[ -z "$RESTRICTED_PATTERNS" ]]; then
            echo "AGENTUM_RESTRICTED_PATTERNS is required for release validation" >&2
            exit 1
          fi
          patterns="$(mktemp)"
          chmod 600 "$patterns"
          trap 'rm -f "$patterns"' EXIT
          printf '%s\n' "$RESTRICTED_PATTERNS" > "$patterns"
          scripts/check-sdd-boundary.sh "$patterns"

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: OpenSpec pinned golden and round-trip gate
        run: cargo test --locked -p agentum-server openspec_ --no-fail-fast

      # Build the test binaries first (default shell — on Windows that's pwsh, so
      # linking uses MSVC's link.exe, not Git Bash's), then copy the staged sherpa/
      # onnxruntime libs next to them, then run. The test binaries load those libs
      # from their own dir at startup (macOS @loader_path / Linux $ORIGIN / Windows
      # DLL search all resolve target/debug/deps/), but staging puts them in
      # target/release/ — so without this copy the binaries SIGABRT / fail to load
      # at runtime even though they linked fine. Copying (vs a DYLD_*/LD_* env var)
      # is the only approach that survives macOS SIP stripping those vars.
      - name: cargo test (build)
        run: cargo test --locked --all --no-run
      - name: Stage sherpa libs next to test binaries
        shell: bash
        run: |
          for ext in dylib so dll; do
            cp target/release/*sherpa*."$ext" target/release/*onnxruntime*."$ext" target/debug/deps/ 2>/dev/null || true
          done
      # Windows hosted runners do not consistently export HOME. Tests that
      # temporarily override configuration roots must always have one stable
      # value to restore or parallel environment readers can observe no home.
      - name: Expose Windows home to tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $homePath = [Environment]::GetFolderPath('UserProfile')
          "HOME=$homePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: cargo test (run)
        run: cargo test --locked --all

      - name: Enforce Windows remote-client-only SDD boundary
        if: runner.os == 'Windows'
        run: cargo test --locked -p agentum-server windows_local_sdd_boundary -- --nocapture

  provider-authority:
    name: provider runner execution authority
    # This hosted, secret-free job is the only path to the persistent provider
    # runner. Ordinary branch pushes never reach model credentials. A release
    # tag must be signed, annotated, semver-shaped, and point at the exact HEAD
    # of protected main before any candidate build script can run there.
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate signed annotated exact-main tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_PROVIDER: ${{ vars.AGENTUM_RELEASE_PROVIDER }}
        run: |
          set -euo pipefail
          case "$RELEASE_PROVIDER" in
            claude|codex|agent|gemini|hermes|opencode|aider) ;;
            *)
              echo "configure AGENTUM_RELEASE_PROVIDER as a bundled provider before releasing" >&2
              exit 1
              ;;
          esac
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = "refs/tags/$TAG"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
          test "$(gh api "repos/$REPO/branches/main" --jq '.protected')" = "true"
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$TAG^{}")" = "$(git rev-parse HEAD)"
          tag_object="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          test -n "$tag_object"
          test "$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.verification.verified')" = "true"
          test "$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.object.type')" = "commit"
          test "$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.object.sha')" = "$(git rev-parse HEAD)"

  provider-conformance:
    name: live Standard + Guarded provider conformance
    # Never expose persisted model credentials to pull-request, dispatch, or
    # ordinary branch code. The hosted authority gate admits only a signed,
    # annotated release tag at the exact protected-main HEAD. A missing runner,
    # sandbox, CLI, authentication session, or lifecycle result fails closed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [provider-authority, rust]
    runs-on: [self-hosted, linux, x64, agentum-provider-conformance]
    timeout-minutes: 360
    env:
      RELEASE_PROVIDER: ${{ vars.AGENTUM_RELEASE_PROVIDER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Require the Agentum provider sandbox
        shell: bash
        run: |
          set -euo pipefail
          command -v bwrap
          bwrap --version
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
      - name: Build the conformance runner from the candidate source
        run: >-
          cargo build --locked --release -p agentum-server
          --bin agentum-sdd-provider-conformance
      - name: Run the selected bundled provider through the real lifecycle
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_PROVIDER" in
            claude|codex|agent|gemini|hermes|opencode|aider) ;;
            *)
              echo "unsupported release provider: $RELEASE_PROVIDER" >&2
              exit 1
              ;;
          esac
          report_dir="$RUNNER_TEMP/agentum-provider-conformance-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -e "$report_dir" ]]; then
            echo "stale provider-conformance directory exists; refusing mixed evidence" >&2
            exit 1
          fi
          install -d -m 0700 "$report_dir"
          runner="$PWD/target/release/agentum-sdd-provider-conformance"
          "$runner" run-bundled \
            --source-revision "$GITHUB_SHA" \
            --output "$report_dir/provider-conformance.json" \
            --provider "$RELEASE_PROVIDER"
          "$runner" verify-report \
            --report "$report_dir/provider-conformance.json" \
            --source-revision "$GITHUB_SHA" \
            --require-provider "$RELEASE_PROVIDER"
          report_size="$(stat -c '%s' "$report_dir/provider-conformance.json")"
          (( report_size > 0 && report_size <= 2097152 ))
          (
            cd "$report_dir"
            sha256sum provider-conformance.json > SHA256SUMS
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-conformance-${{ github.sha }}
          path: ${{ runner.temp }}/agentum-provider-conformance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: verified release pipeline
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, provider-authority, provider-conformance]
    permissions:
      contents: write # Creates and publishes the tag's verified release.
    uses: ./.github/workflows/release.yml
    with:
      publish: true
      provider_id: ${{ vars.AGENTUM_RELEASE_PROVIDER }}
      provider_report_artifact: provider-conformance-${{ github.sha }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      AGENTUM_RESTRICTED_PATTERNS: ${{ secrets.AGENTUM_RESTRICTED_PATTERNS }}

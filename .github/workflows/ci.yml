name: ci

# Runs only when we cut a release (tag push) or via manual dispatch.
# We don't gate every commit to main — keeps the Actions tab quiet.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain (not @stable) so CI's rustfmt + clippy match the
      # repo's rust-toolchain.toml and what developers run locally. @stable
      # set RUSTUP_TOOLCHAIN=stable, which overrides rust-toolchain.toml and
      # floated CI to newer, stricter tooling — turning ci red on tags the
      # author had verified green (v0.8.12 clippy, v0.8.13 fmt). Keep this in
      # lockstep with rust-toolchain.toml's channel when bumping.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build dashboard bundle (needed for rust-embed)
        run: pnpm --dir dashboard install --frozen-lockfile && pnpm --dir dashboard build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

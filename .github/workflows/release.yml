name: release

on:
  push:
    tags:
      - 'v*.*.*'
  # Allow manual desktop-only builds without a full release.
  workflow_dispatch:
    inputs:
      desktop-only:
        description: 'Build desktop bundles only (skip CLI tarballs)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BIN_NAME: agentum

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin to ubuntu-22.04 (glibc 2.35) so the resulting binary
          # runs on Debian 12, Ubuntu 22.04, and similarly aged
          # distros. ubuntu-latest is 24.04 (glibc 2.39), which made
          # older systems refuse to load the executable.
          # `desktop` lists the Tauri bundle formats for that target (absent =
          # CLI only). aarch64-linux is cross-compiled and can't carry the
          # target's webkit libs, so it ships the CLI only.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: false
            desktop: deb
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-14
            cross: false
            desktop: dmg
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            desktop: dmg
    steps:
      - uses: actions/checkout@v4

      # Desktop targets build the Tauri UI (crates/agentum-desktop/ui), which is
      # embedded into the binary via generate_context!. The old standalone
      # dashboard/ was removed in the thin-shell refactor (v0.10.11), so the
      # daemon/CLI no longer embeds web assets and CLI-only targets need no node.
      # cargo tauri build runs the UI's `npm run build` via beforeBuildCommand,
      # but node_modules must exist first — hence the explicit `npm ci`.
      - uses: actions/setup-node@v4
        if: ${{ matrix.desktop != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/agentum-desktop/ui/package-lock.json
      - name: Install desktop UI deps
        if: ${{ matrix.desktop != '' }}
        run: npm ci --prefix crates/agentum-desktop/ui

      # Pin to 1.94.1 to match rust-toolchain.toml (and ci.yml). @stable sets
      # RUSTUP_TOOLCHAIN=stable and would add the matrix target to *stable* —
      # but rust-toolchain.toml forces 1.94.1 for the actual build, leaving the
      # cross-target (x86_64-apple-darwin on the arm64 mac runner) without a std
      # and failing with "can't find crate for `core`" (broke v0.9.0/v0.9.1).
      # Installing the target onto the pinned toolchain cargo actually uses fixes it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install --locked cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p agentum-cli

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p agentum-cli

      # --- Desktop installers (Tauri 2) -------------------------------------
      # cargo tauri build produces native installers (.dmg on macOS, .deb +
      # .AppImage on Linux x86_64). The dashboard built above is embedded via
      # agentum-server, so the window has a UI. Only runs for targets whose
      # matrix entry sets `desktop`.
      - name: Install desktop build deps (Linux)
        if: ${{ matrix.desktop != '' && contains(matrix.target, 'linux') }}
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev is required by Tauri's `tray-icon`
          # feature at LINK time — without it the desktop build aborts with
          # "Can't detect any appindicator library" (broke v0.10.8 on Linux).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev patchelf libfuse2 file \
            libayatana-appindicator3-dev
      - name: Install tauri-cli
        if: ${{ matrix.desktop != '' }}
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Build desktop installers
        if: ${{ matrix.desktop != '' }}
        working-directory: crates/agentum-desktop
        # Workspace target dir resolves at the repo root → bundles land in
        # target/<triple>/release/bundle/ (consumed by the staging step).
        # Linux builds the .deb here (reliable); the AppImage is a separate
        # best-effort step below since its toolchain is finicky on CI.
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.desktop }}

      # AppImage is the only Arch-friendly format, but linuxdeploy/appimagetool
      # are flaky on CI (no FUSE). Best-effort: if it fails we still ship the
      # .deb + the raw binary, so the release never blocks on it.
      # APPIMAGE_EXTRACT_AND_RUN lets the tooling run without FUSE.
      - name: Build desktop AppImage (Linux, best-effort)
        if: ${{ matrix.desktop != '' && contains(matrix.target, 'linux') }}
        continue-on-error: true
        working-directory: crates/agentum-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: cargo tauri build --target ${{ matrix.target }} --bundles appimage

      - name: Stage release
        shell: bash
        run: |
          set -eux
          OUT="dist/${BIN_NAME}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$OUT/"
          cp LICENSE README.md CHANGELOG.md "$OUT/"
          ( cd dist && tar -czf "${BIN_NAME}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "${BIN_NAME}-${{ github.ref_name }}-${{ matrix.target }}" )
          # Desktop installers (.dmg/.deb/.AppImage) ship as standalone assets,
          # suffixed with the target triple so they don't collide when the
          # release job merges every target's artifacts into one dir.
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 \
              | while IFS= read -r -d '' f; do
                  base="$(basename "$f")"
                  cp "$f" "dist/${base%.*}-${{ matrix.target }}.${base##*.}"
                done
          fi
          # Raw Linux desktop binary — the artifact that runs on Arch and other
          # non-deb distros (install.sh falls back to it when no AppImage). macOS
          # users get the .app inside the .dmg, so only ship it for Linux.
          DESK_BIN="target/${{ matrix.target }}/release/agentum-desktop"
          if [ -n "${{ matrix.desktop }}" ] && [ -f "$DESK_BIN" ] && [[ "${{ matrix.target }}" == *linux* ]]; then
            cp "$DESK_BIN" "dist/agentum-desktop-${{ github.ref_name }}-${{ matrix.target }}"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # tar.gz is always present; installer globs match only on targets
          # that built them. The combined set is never empty, so `error` is safe.
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/agentum-desktop-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Generate sha256 sums
        run: |
          set -eux
          ( cd dist && sha256sum $(ls *.tar.gz *.dmg *.deb *.AppImage agentum-desktop-* 2>/dev/null) > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Stage installer + uninstaller
        run: |
          set -eux
          # Attached to the release so `…/releases/latest/download/install.sh`
          # and …/uninstall.sh work (the README's recommended one-liners).
          cp scripts/install.sh dist/install.sh
          cp scripts/uninstall.sh dist/uninstall.sh

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          set -eux
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          # Pull the section for this version out of CHANGELOG.md
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/agentum-desktop-*
            dist/SHA256SUMS
            dist/install.sh
            dist/uninstall.sh

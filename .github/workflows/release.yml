name: release

on:
  push:
    tags:
      - 'v*.*.*'
  # Allow manual desktop-only builds without a full release.
  workflow_dispatch:
    inputs:
      desktop-only:
        description: 'Build desktop bundles only (skip CLI tarballs)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BIN_NAME: agentum

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin to ubuntu-22.04 (glibc 2.35) so the resulting binary
          # runs on Debian 12, Ubuntu 22.04, and similarly aged
          # distros. ubuntu-latest is 24.04 (glibc 2.39), which made
          # older systems refuse to load the executable.
          # `desktop` lists the Tauri bundle formats for that target (absent =
          # CLI only). aarch64-linux is cross-compiled and can't carry the
          # target's webkit libs, so it ships the CLI only.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: false
            desktop: deb,rpm
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-14
            cross: false
            desktop: dmg
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            desktop: dmg
          # Windows x64. NSIS produces the .exe installer (like Orca's
          # orca-windows-setup.exe). The daemon shells out to tmux (no native
          # Windows port), so this ships as a remote client; local sessions need
          # WSL — but the app installs and drives remote SSH hosts.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            desktop: nsis
          # NOTE: aarch64-pc-windows-msvc is intentionally NOT built yet. aws-lc-sys
          # (the rustls crypto backend) fails to assemble its ARM64 .S files when
          # cross-compiled on the x64 runner (LNK1181: chacha-armv8.o missing).
          # Fixing it means swapping the whole TLS stack to ring or wiring an ARM64
          # assembler — tracked in #13 as a follow-up. x64 Windows ships today.
    steps:
      - uses: actions/checkout@v4

      # Desktop targets build the Tauri UI (crates/agentum-desktop/ui), which is
      # embedded into the binary via generate_context!. The old standalone
      # dashboard/ was removed in the thin-shell refactor (v0.10.11), so the
      # daemon/CLI no longer embeds web assets and CLI-only targets need no JS
      # toolchain. cargo tauri build runs the UI's `bun run build` via
      # beforeBuildCommand (cwd = the frontendDist parent, i.e. ui/), but the
      # deps must be installed first — hence the explicit `bun install`.
      - uses: oven-sh/setup-bun@v2
        if: ${{ matrix.desktop != '' }}
        with:
          bun-version: "1.3.14"
      - name: Install desktop UI deps
        if: ${{ matrix.desktop != '' }}
        working-directory: crates/agentum-desktop/ui
        run: bun install --frozen-lockfile

      # Pin to 1.94.1 to match rust-toolchain.toml (and ci.yml). @stable sets
      # RUSTUP_TOOLCHAIN=stable and would add the matrix target to *stable* —
      # but rust-toolchain.toml forces 1.94.1 for the actual build, leaving the
      # cross-target (x86_64-apple-darwin on the arm64 mac runner) without a std
      # and failing with "can't find crate for `core`" (broke v0.9.0/v0.9.1).
      # Installing the target onto the pinned toolchain cargo actually uses fixes it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      # No rust-cache on purpose. sherpa-rs's `download-binaries` stages the
      # onnxruntime/sherpa native libs during a *cold* build, but a restored
      # cache leaves them off the linker search path → "unable to find library
      # -lonnxruntime" on Linux. That broke v0.14.2's cache-hit re-run even
      # though the cold (cache-miss) run was fully green. Releases are
      # infrequent, so a reliable cold compile beats a flaky cached one.

      # Windows build deps: MSVC (puts cl.exe on PATH) + nasm for ring/aws-lc
      # assembly, and override the repo .cargo/config CC=/usr/bin/gcc pin (a
      # unix-only local-dev workaround) so cc-rs uses MSVC. Must run BEFORE the
      # cargo build steps below.
      - name: Set up MSVC (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # Cross to ARM64 from the x64 runner for aarch64-pc-windows-msvc.
          arch: ${{ contains(matrix.target, 'aarch64') && 'amd64_arm64' || 'amd64' }}
      - name: Install nasm (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        uses: ilammy/setup-nasm@v1
      - name: Use MSVC compiler instead of the gcc pin (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: bash
        run: echo "CC=cl" >> "$GITHUB_ENV"

      - name: Install cross
        if: matrix.cross
        run: cargo install --locked cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p agentum-tui

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p agentum-tui

      # --- Desktop installers (Tauri 2) -------------------------------------
      # cargo tauri build produces native installers (.dmg on macOS, .deb +
      # .AppImage on Linux x86_64). The dashboard built above is embedded via
      # agentum-server, so the window has a UI. Only runs for targets whose
      # matrix entry sets `desktop`.
      - name: Install desktop build deps (Linux)
        if: ${{ matrix.desktop != '' && contains(matrix.target, 'linux') }}
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev is required by Tauri's `tray-icon`
          # feature at LINK time — without it the desktop build aborts with
          # "Can't detect any appindicator library" (broke v0.10.8 on Linux).
          # libasound2-dev ships alsa.pc for `alsa-sys`, pulled in transitively
          # by the voice-STT capture path (cpal) in agentum-desktop — without it
          # the build panics with "Package alsa was not found in the pkg-config
          # search path" (broke v0.14.1 on Linux).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev patchelf libfuse2 file \
            libayatana-appindicator3-dev libasound2-dev
      - name: Install tauri-cli
        if: ${{ matrix.desktop != '' }}
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Build desktop installers
        if: ${{ matrix.desktop != '' }}
        working-directory: crates/agentum-desktop
        # Signing keys for the updater. createUpdaterArtifacts (tauri.conf.json)
        # makes the build emit a signed updater archive + .sig per bundle; without
        # these secrets `cargo tauri build` aborts. Set both repo secrets BEFORE
        # tagging a release: TAURI_SIGNING_PRIVATE_KEY (the base64 private key) and
        # TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the password chosen at key-gen).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # shell: bash so this multi-line script runs under bash on Windows too —
        # the default Windows shell is PowerShell, which can't parse the bash
        # `[[ ]]`/`for` syntax (ParserError). Windows runners ship git-bash.
        shell: bash
        # Workspace target dir resolves at the repo root → bundles land in
        # target/<triple>/release/bundle/ (consumed by the staging step).
        # Linux builds the .deb here (reliable); the AppImage is a separate
        # best-effort step below since its toolchain is finicky on CI.
        #
        # macOS dylib staging (the blocker that failed v0.14.0/.1/.2): tauri.conf's
        # macOS `frameworks` AND build.rs's `tauri_build::build()` validate the
        # paths ../../target/release/libsherpa-*.dylib (+ libonnxruntime), but a
        # `--target` cross-build emits those dylibs into target/<triple>/release/,
        # so the frameworks check aborts with "Library not found".
        #
        # Produce the dylibs first by building ONLY the `sherpa-rs` dep: that runs
        # sherpa-rs-sys's build script (which drops the dylibs in the target dir)
        # WITHOUT compiling agentum-desktop — whose build.rs would hit the same
        # frameworks check, and whose generate_context! needs ui/dist (not built
        # until `cargo tauri build` runs beforeBuildCommand). Then copy the dylibs
        # to where the frameworks expect them and bundle. Linux has no frameworks
        # and beforeBuildCommand builds ui/dist, so it just runs the bundle.
        run: |
          if [[ "${{ matrix.target }}" == *apple-darwin* ]]; then
            cargo build --release --target ${{ matrix.target }} -p sherpa-rs
            mkdir -p ../../target/release
            for lib in libsherpa-onnx-c-api.dylib libsherpa-onnx-cxx-api.dylib libonnxruntime.1.17.1.dylib; do
              cp -f "../../target/${{ matrix.target }}/release/$lib" "../../target/release/$lib"
            done
          fi
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            # git-bash ships /usr/bin/link.exe (GNU coreutils `link`), which under
            # shell: bash shadows the MSVC linker → "linking with link.exe failed".
            # Remove it so cargo uses MSVC's link.exe (msvc-dev-cmd set the path).
            rm -f "/c/Program Files/Git/usr/bin/link.exe" || true
          fi
          cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.desktop }}

      # AppImage is the only Arch-friendly format, but linuxdeploy/appimagetool
      # are flaky on CI (no FUSE). Best-effort: if it fails we still ship the
      # .deb + the raw binary, so the release never blocks on it.
      # APPIMAGE_EXTRACT_AND_RUN lets the tooling run without FUSE.
      - name: Build desktop AppImage (Linux, best-effort)
        if: ${{ matrix.desktop != '' && contains(matrix.target, 'linux') }}
        continue-on-error: true
        working-directory: crates/agentum-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          # Same updater signing keys as the main bundle step — the AppImage is
          # the Linux updater format, so its .AppImage.tar.gz must be signed too.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.target }} --bundles appimage

      - name: Stage release
        shell: bash
        run: |
          set -eux
          # Clean, Orca-style asset label: <os>-<arch>. The raw Rust triple was
          # redundant — the tauri bundle name already carries an arch, which made
          # names like agentum_0.14.3_aarch64-aarch64-apple-darwin.dmg.
          case "${{ matrix.target }}" in
            x86_64-apple-darwin)       OSARCH="macos-x64" ;;
            aarch64-apple-darwin)      OSARCH="macos-arm64" ;;
            x86_64-pc-windows-msvc)    OSARCH="windows-x64" ;;
            aarch64-pc-windows-msvc)   OSARCH="windows-arm64" ;;
            x86_64-unknown-linux-gnu)  OSARCH="linux-x64" ;;
            aarch64-unknown-linux-gnu) OSARCH="linux-arm64" ;;
            *)                         OSARCH="${{ matrix.target }}" ;;
          esac
          VER="${GITHUB_REF_NAME#v}"   # v0.14.4 -> 0.14.4 on a tag; the branch on dispatch
          STEM="agentum-${VER}-${OSARCH}"

          # CLI tarball.
          OUT="dist/${STEM}"
          mkdir -p "$OUT"
          # The CLI binary is `agentum` on unix, `agentum.exe` on Windows.
          BIN="target/${{ matrix.target }}/release/${BIN_NAME}"
          [ -f "$BIN" ] || BIN="${BIN}.exe"
          cp "$BIN" "$OUT/"
          cp LICENSE README.md CHANGELOG.md "$OUT/"
          ( cd dist && tar -czf "${STEM}.tar.gz" "${STEM}" )

          # Desktop installers → agentum-<ver>-<os>-<arch>.<ext> (the NSIS
          # installer keeps a -setup suffix). Clean + versioned, no triple.
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.msi' \) -print0 \
              | while IFS= read -r -d '' f; do
                  base="$(basename "$f")"; ext="${base##*.}"
                  case "$base" in
                    *-setup.exe) cp "$f" "dist/${STEM}-setup.exe" ;;
                    *)           cp "$f" "dist/${STEM}.${ext}" ;;
                  esac
                done
          fi

          # Updater artifacts (signed) for the Tauri auto-updater. With
          # createUpdaterArtifacts the build emits, next to each installer:
          #   macOS   → <app>.app.tar.gz            (+ .sig)
          #   Linux   → <app>_<ver>_*.AppImage.tar.gz (+ .sig)  [best-effort target]
          #   Windows → <app>_<ver>_*-setup.exe.sig  (sidecar to the NSIS .exe)
          # Stage them with the same clean <stem> names so latest.json can point
          # at predictable release-asset URLs. The setup.exe itself was copied above.
          if [ -d "$BUNDLE_DIR" ]; then
            while IFS= read -r -d '' f; do cp "$f" "dist/${STEM}.app.tar.gz" ;     done < <(find "$BUNDLE_DIR" -type f -name '*.app.tar.gz' -print0)
            while IFS= read -r -d '' f; do cp "$f" "dist/${STEM}.app.tar.gz.sig" ; done < <(find "$BUNDLE_DIR" -type f -name '*.app.tar.gz.sig' -print0)
            while IFS= read -r -d '' f; do cp "$f" "dist/${STEM}.AppImage.tar.gz" ;     done < <(find "$BUNDLE_DIR" -type f -name '*.AppImage.tar.gz' -print0)
            while IFS= read -r -d '' f; do cp "$f" "dist/${STEM}.AppImage.tar.gz.sig" ; done < <(find "$BUNDLE_DIR" -type f -name '*.AppImage.tar.gz.sig' -print0)
            while IFS= read -r -d '' f; do cp "$f" "dist/${STEM}-setup.exe.sig" ;   done < <(find "$BUNDLE_DIR" -type f -name '*-setup.exe.sig' -print0)
          fi

          # Raw Linux desktop binary — runs on Arch and other non-deb distros
          # (install.sh falls back to it when no AppImage). macOS users get the
          # .app inside the .dmg, so only ship it for Linux.
          DESK_BIN="target/${{ matrix.target }}/release/agentum-desktop"
          if [ -n "${{ matrix.desktop }}" ] && [ -f "$DESK_BIN" ] && [[ "${{ matrix.target }}" == *linux* ]]; then
            cp "$DESK_BIN" "dist/agentum-desktop-${VER}-${OSARCH}"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # tar.gz is always present; installer globs match only on targets
          # that built them. The combined set is never empty, so `error` is safe.
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/*.msi
            dist/*.sig
            dist/agentum-desktop-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: github release
    # Only publish on a tag push. A manual workflow_dispatch (used to test the
    # build matrix — e.g. the Windows port) still runs `build` but skips this, so
    # a dispatch never creates a junk release named after a branch.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Generate sha256 sums
        run: |
          set -eux
          ( cd dist && sha256sum $(ls *.tar.gz *.dmg *.deb *.rpm *.AppImage *.exe *.msi agentum-desktop-* 2>/dev/null) > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Stage installer + uninstaller
        run: |
          set -eux
          # Attached to the release so `…/releases/latest/download/install.sh`
          # and …/uninstall.sh work (the README's recommended one-liners).
          cp scripts/install.sh dist/install.sh
          cp scripts/uninstall.sh dist/uninstall.sh

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          set -eux
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          # Pull the section for this version out of CHANGELOG.md
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "----"
          cat release-notes.md

      - name: Build updater manifest (latest.json)
        shell: bash
        # The Tauri updater fetches this from the `endpoints` URL
        # (…/releases/latest/download/latest.json). Each platform entry carries the
        # release-asset URL of the signed updater bundle plus its detached
        # signature (the .sig file's contents). Platforms whose .sig is missing
        # (e.g. AppImage failed its best-effort build) are logged and omitted
        # rather than emitted with an empty signature, which would break verify.
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          ver="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          pubdate="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          platforms='{}'
          emit() {
            key="$1"; asset="$2"; sigf="dist/${asset}.sig"
            if [ -f "$sigf" ]; then
              platforms="$(jq --arg k "$key" --arg url "${base}/${asset}" --rawfile sig "$sigf" \
                '. + {($k): {signature: $sig, url: $url}}' <<<"$platforms")"
            else
              echo "WARN: missing ${sigf} — omitting ${key} from latest.json"
            fi
          }
          emit darwin-aarch64 "agentum-${ver}-macos-arm64.app.tar.gz"
          emit darwin-x86_64  "agentum-${ver}-macos-x64.app.tar.gz"
          emit windows-x86_64 "agentum-${ver}-windows-x64-setup.exe"
          emit linux-x86_64   "agentum-${ver}-linux-x64.AppImage.tar.gz"
          jq -n --arg v "$ver" --arg d "$pubdate" --rawfile n release-notes.md --argjson p "$platforms" \
            '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > dist/latest.json
          cat dist/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # The AppImage is best-effort (its toolchain is flaky on CI), so it may
          # be absent — don't hard-fail the whole release when an optional glob
          # matches nothing. The required artifacts (.dmg/.deb/tarballs) are
          # already gated by the build jobs, which must succeed to reach here.
          fail_on_unmatched_files: false
          files: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/*.msi
            dist/*.sig
            dist/latest.json
            dist/agentum-desktop-*
            dist/SHA256SUMS
            dist/install.sh
            dist/uninstall.sh

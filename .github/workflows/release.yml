name: release

on:
  # Reusable callers may invoke tag publication only after their validation
  # jobs pass. This prevents a tag from racing an independent release workflow
  # and publishing binaries while upstream validation is red.
  workflow_call:
    inputs:
      publish:
        description: 'Create the version-matched release after every gate and bundle validates'
        required: true
        type: boolean
      provider_id:
        description: 'Bundled provider proven by the source-bound lifecycle report'
        required: true
        type: string
      provider_report_artifact:
        description: 'Source-bound artifact produced by the selected-provider lifecycle gate'
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      AGENTUM_RESTRICTED_PATTERNS:
        required: true
  # With CI removed, maintainers can run this workflow directly against a
  # signed release tag. The configured repository provider is selected instead
  # of silently defaulting to a provider in this workflow.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the version-matched release after every bundle validates'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version and publication authority
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PROVIDER_ID: ${{ github.event_name == 'workflow_call' && inputs.provider_id || vars.AGENTUM_RELEASE_PROVIDER }}
        run: |
          set -euo pipefail
          case "$PROVIDER_ID" in
            claude|codex|agent|gemini|hermes|opencode|aider) ;;
            *)
              echo "unsupported release provider: $PROVIDER_ID" >&2
              exit 1
              ;;
          esac
          version="$(jq -r '.version' crates/agentum-desktop/tauri.conf.json)"
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$workspace_version"
          test "$(grep -Ec "^## \[$version\]" CHANGELOG.md)" -eq 1
          if [[ "$PUBLISH" == "true" ]]; then
            test "$GITHUB_REF" = "refs/tags/v${version}"
            test "$TAG" = "v${version}"
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
            test "$(gh api "repos/$REPO/branches/main" --jq '.protected')" = "true"
            test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
            test "$(git rev-parse "refs/tags/$TAG^{}")" = "$(git rev-parse HEAD)"
            tag_object="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            test -n "$tag_object"
            test "$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.verification.verified')" = "true"
            test "$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.object.type')" = "commit"
            test "$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.object.sha')" = "$(git rev-parse HEAD)"
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "release already exists for $TAG; refusing a version collision" >&2
              exit 1
            fi
          else
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          fi
      - name: Install trusted evidence verifier system dependencies
        if: inputs.publish && github.event_name == 'workflow_call'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-dev \
            pkg-config
      - name: Install pinned Rust toolchain for trusted evidence verifier
        if: inputs.publish && github.event_name == 'workflow_call'
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
      - name: Build evidence verifier from authority-checked source
        if: inputs.publish && github.event_name == 'workflow_call'
        run: >-
          cargo build --locked --release -p agentum-server
          --bin agentum-sdd-provider-conformance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.publish && github.event_name == 'workflow_call'
        with:
          name: ${{ inputs.provider_report_artifact }}
          path: provider-conformance
      - name: Verify untrusted source-bound provider evidence as data
        if: inputs.publish && github.event_name == 'workflow_call'
        shell: bash
        env:
          PROVIDER_REPORT_ARTIFACT: ${{ inputs.provider_report_artifact }}
          PROVIDER_ID: ${{ inputs.provider_id }}
        run: |
          set -euo pipefail
          test -n "$PROVIDER_REPORT_ARTIFACT"
          test -f provider-conformance/provider-conformance.json
          test ! -L provider-conformance/provider-conformance.json
          report_size="$(stat -c '%s' provider-conformance/provider-conformance.json)"
          (( report_size > 0 && report_size <= 2097152 ))
          test -f provider-conformance/SHA256SUMS
          test ! -L provider-conformance/SHA256SUMS
          test "$(find provider-conformance -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test -z "$(find provider-conformance -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test "$(wc -l < provider-conformance/SHA256SUMS)" -eq 1
          grep -Eq '^[0-9a-f]{64}  provider-conformance.json$' provider-conformance/SHA256SUMS
          (cd provider-conformance && sha256sum -c SHA256SUMS)
          runner="$GITHUB_WORKSPACE/target/release/agentum-sdd-provider-conformance"
          test -x "$runner"
          "$runner" verify-report \
            --report "$GITHUB_WORKSPACE/provider-conformance/provider-conformance.json" \
            --source-revision "$GITHUB_SHA" \
            --require-provider "$PROVIDER_ID"
      - name: Validate restricted-content release policy availability
        shell: bash
        env:
          RESTRICTED_PATTERNS: ${{ secrets.AGENTUM_RESTRICTED_PATTERNS }}
        run: test -n "$RESTRICTED_PATTERNS"
  build:
    name: build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin to ubuntu-22.04 (glibc 2.35) so the resulting binary
          # runs on Debian 12, Ubuntu 22.04, and similarly aged
          # distros. ubuntu-latest is 24.04 (glibc 2.39), which made
          # older systems refuse to load the executable.
          # `desktop` lists the Tauri bundle formats for that target. This repo
          # is desktop-only — the CLI/TUI moved to github.com/mateocerquetella/agentum-tui,
          # so every target here builds a desktop bundle. (The CLI-only
          # aarch64-linux cross target was removed with the CLI.)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            desktop: deb,rpm,appimage
          # Windows x64. NSIS produces the signed .exe installer. The daemon shells out to tmux (no native
          # Windows port), so this ships as a remote client; local sessions need
          # WSL — but the app installs and drives remote SSH hosts.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            desktop: nsis
          # NOTE: aarch64-pc-windows-msvc is intentionally NOT built yet. aws-lc-sys
          # (the rustls crypto backend) fails to assemble its ARM64 .S files when
          # cross-compiled on the x64 runner (LNK1181: chacha-armv8.o missing).
          # Fixing it means swapping the whole TLS stack to ring or wiring an ARM64
          # assembler — tracked in #13 as a follow-up. x64 Windows ships today.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Ripgrep
        shell: bash
        run: |
          scripts/install-ripgrep.sh "$RUNNER_TEMP/ripgrep-bin"
          printf '%s\n' "$RUNNER_TEMP/ripgrep-bin" >> "$GITHUB_PATH"

      # Desktop targets build the Tauri UI (crates/agentum-desktop/ui), which is
      # embedded into the binary via generate_context!. The old standalone
      # dashboard/ was removed in the thin-shell refactor (v0.10.11), so the
      # daemon no longer embeds web assets. (Every target in this repo is a
      # desktop target now — the CLI/TUI moved to its own repo,
      # github.com/mateocerquetella/agentum-tui.) cargo tauri build runs the
      # UI's `bun run build` via beforeBuildCommand (cwd = the frontendDist
      # parent, i.e. ui/), but the deps must be installed first — hence the
      # explicit `bun install`.
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Install desktop UI deps
        working-directory: crates/agentum-desktop/ui
        run: bun install --frozen-lockfile && bun audit

      # Pin to 1.94.1 to match rust-toolchain.toml. @stable sets
      # RUSTUP_TOOLCHAIN=stable and would add the matrix target to *stable* —
      # but rust-toolchain.toml forces 1.94.1 for the actual build, leaving that
      # toolchain's matrix target without a std and failing with "can't find
      # crate for `core`" (broke v0.9.0/v0.9.1).
      # Installing the target onto the pinned toolchain cargo actually uses fixes it.
      - name: Install pinned Rust toolchain
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.94.1 --profile minimal --target "$BUILD_TARGET"
          rustup default 1.94.1

      # No rust-cache on purpose. sherpa-rs's `download-binaries` stages the
      # onnxruntime/sherpa native libs during a *cold* build, but a restored
      # cache leaves them off the linker search path → "unable to find library
      # -lonnxruntime" on Linux. That broke v0.14.2's cache-hit re-run even
      # though the cold (cache-miss) run was fully green. Releases are
      # infrequent, so a reliable cold compile beats a flaky cached one.

      # Windows build deps: MSVC (puts cl.exe on PATH) + nasm for ring/aws-lc
      # assembly, and override the repo .cargo/config CC=/usr/bin/gcc pin (a
      # unix-only local-dev workaround) so cc-rs uses MSVC. Must run BEFORE the
      # `cargo tauri build` step below.
      - name: Set up MSVC (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - name: Install nasm (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - name: Use MSVC compiler instead of the gcc pin (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: bash
        run: echo "CC=cl" >> "$GITHUB_ENV"

      # --- Desktop installers (Tauri 2) -------------------------------------
      # cargo tauri build produces the Linux and Windows native installers. The
      # dashboard built above is embedded via agentum-server, so the window has
      # a UI. Every supported release matrix entry is a desktop target.
      - name: Install desktop build deps (Linux)
        if: ${{ contains(matrix.target, 'linux') }}
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev is required by Tauri's `tray-icon`
          # feature at LINK time — without it the desktop build aborts with
          # "Can't detect any appindicator library" (broke v0.10.8 on Linux).
          # libasound2-dev ships alsa.pc for `alsa-sys`, pulled in transitively
          # by the voice-STT capture path (cpal) in agentum-desktop — without it
          # the build panics with "Package alsa was not found in the pkg-config
          # search path" (broke v0.14.1 on Linux).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev patchelf libfuse2 file rpm binutils \
            libayatana-appindicator3-dev libasound2-dev
      - name: Install tauri-cli
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: tauri-cli@2.11.2
      - name: Install pinned linuxdeploy (Linux)
        if: ${{ contains(matrix.target, 'linux') }}
        shell: bash
        run: scripts/install-linuxdeploy.sh "$GITHUB_WORKSPACE/target/.tauri"
      - name: Build desktop installers
        working-directory: crates/agentum-desktop
        # Signing keys for the updater. createUpdaterArtifacts (tauri.conf.json)
        # makes the build emit a signed updater archive + .sig per bundle; without
        # these secrets `cargo tauri build` aborts. Set both repo secrets BEFORE
        # tagging a release: TAURI_SIGNING_PRIVATE_KEY (the base64 private key) and
        # TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the password chosen at key-gen).
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUNDLE_FORMATS: ${{ matrix.desktop }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # AppImage tooling must run without FUSE on hosted runners. AppImage
          # is release-critical because it is also Linux's updater artifact.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Keep compositor-facing libraries aligned with the host EGL/Mesa
          # stack. The pinned linuxdeploy inherits this list in plugin subprocesses.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: ${{ contains(matrix.target, 'linux') && 'libwayland-client.so*;libwayland-cursor.so*;libwayland-egl.so*;libwayland-server.so*' || '' }}
          NO_STRIP: "true"
        # shell: bash so this multi-line script runs under bash on Windows too —
        # the default Windows shell is PowerShell, which can't parse the bash
        # `[[ ]]`/`for` syntax (ParserError). Windows runners ship git-bash.
        shell: bash
        # Workspace target dir resolves at the repo root → bundles land in
        # target/<triple>/release/bundle/ (consumed by the staging step).
        # Linux builds the .deb here (reliable); the AppImage is a separate
        # best-effort step below since its toolchain is finicky on CI.
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [[ "$BUILD_TARGET" == *linux* ]]; then
            # sherpa-rs-sys copies its shared objects beside the release binary.
            # linuxdeploy does not search that target directory by default, so
            # make it discoverable while AppImage dependencies are collected.
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/$BUILD_TARGET/release${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            # Tauri otherwise downloads its older linuxdeploy build into the
            # account cache. Select the checksum-pinned tool staged above.
            TAURI_CONFIG_ARGS=(--config '{"bundle":{"useLocalToolsDir":true}}')
          else
            TAURI_CONFIG_ARGS=()
          fi
          if [[ "$BUILD_TARGET" == *windows* ]]; then
            # git-bash ships /usr/bin/link.exe (GNU coreutils `link`), which under
            # shell: bash shadows the MSVC linker → "linking with link.exe failed".
            # Remove it so cargo uses MSVC's link.exe (msvc-dev-cmd set the path).
            rm -f "/c/Program Files/Git/usr/bin/link.exe" || true
          fi
          # tauri-cli 2.11.2 has no top-level --locked option. Arguments after
          # `--` are inserted into its Cargo runner immediately after
          # `cargo build`, so this becomes a lockfile-enforced build.
          cargo tauri build --target "$BUILD_TARGET" --bundles "$BUNDLE_FORMATS" \
            "${TAURI_CONFIG_ARGS[@]}" --verbose -- --locked

      - name: Build version-matched SDD SSH worker (Linux x64)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: >-
          cargo build --locked --release --target "$BUILD_TARGET"
          -p agentum-server --bin agentum-sdd-worker

      - name: Stage release
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUNDLE_FORMATS: ${{ matrix.desktop }}
        run: |
          set -euo pipefail
          # Stable supported asset label: <os>-<arch>.
          case "$BUILD_TARGET" in
            x86_64-pc-windows-msvc)    OSARCH="windows-x64" ;;
            x86_64-unknown-linux-gnu)  OSARCH="linux-x64" ;;
            *)
              echo "unsupported release target: $BUILD_TARGET" >&2
              exit 2
              ;;
          esac
          # Use the bundle's declared version even during a branch rehearsal.
          # Publication preflight proves an actual tag is exactly v<version>.
          VER="$(jq -r '.version' crates/agentum-desktop/tauri.conf.json)"
          STEM="agentum-${VER}-${OSARCH}"
          # Staging dir for all desktop assets (previously created by the CLI
          # tarball step, which is gone now that the CLI lives in its own repo).
          mkdir -p dist

          # Desktop installers → agentum-<ver>-<os>-<arch>.<ext> (the NSIS
          # installer keeps a -setup suffix). Clean + versioned, no triple.
          BUNDLE_DIR="target/$BUILD_TARGET/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' \) -print0 \
              | while IFS= read -r -d '' f; do
                  base="$(basename "$f")"; ext="${base##*.}"
                  case "$base" in
                    *-setup.exe) cp "$f" "dist/${STEM}-setup.exe" ;;
                    *)           cp "$f" "dist/${STEM}.${ext}" ;;
                  esac
                done
          fi

          # Updater artifacts (signed) for the Tauri auto-updater. With
          # createUpdaterArtifacts the build emits, next to each installer:
          #   Linux   → <app>_<ver>_*.AppImage        (+ .sig)
          #   Windows → <app>_<ver>_*-setup.exe.sig  (sidecar to the NSIS .exe)
          # Stage them with the same clean <stem> names so latest.json can point
          # at predictable release-asset URLs. The setup.exe itself was copied above.
          if [ -d "$BUNDLE_DIR" ]; then
            while IFS= read -r -d '' f; do cp "$f" "dist/${STEM}.AppImage.sig" ; done < <(find "$BUNDLE_DIR" -type f -name '*.AppImage.sig' -print0)
            while IFS= read -r -d '' f; do cp "$f" "dist/${STEM}-setup.exe.sig" ;   done < <(find "$BUNDLE_DIR" -type f -name '*-setup.exe.sig' -print0)
          fi

          # Raw Linux desktop binary — runs on Arch and other non-deb distros
          # (install.sh offers it as the explicit raw format).
          DESK_BIN="target/$BUILD_TARGET/release/agentum-desktop"
          if [ -n "$BUNDLE_FORMATS" ] && [ -f "$DESK_BIN" ] && [[ "$BUILD_TARGET" == *linux* ]]; then
            cp "$DESK_BIN" "dist/agentum-desktop-${VER}-${OSARCH}"
          fi
          WORKER_BIN="target/$BUILD_TARGET/release/agentum-sdd-worker"
          if [[ "$BUILD_TARGET" == "x86_64-unknown-linux-gnu" ]]; then
            test -x "$WORKER_BIN"
            cp "$WORKER_BIN" "dist/agentum-sdd-worker-${VER}-${OSARCH}"
          fi
          case "$BUILD_TARGET" in
            x86_64-unknown-linux-gnu)
              test -s "dist/${STEM}.deb"
              test -s "dist/${STEM}.rpm"
              test -s "dist/${STEM}.AppImage"
              test -s "dist/${STEM}.AppImage.sig"
              test -s "dist/agentum-desktop-${VER}-${OSARCH}"
              test -x "dist/agentum-sdd-worker-${VER}-${OSARCH}"
              dpkg-deb --info "dist/${STEM}.deb" >/dev/null
              rpm -qpl "dist/${STEM}.rpm" >/dev/null
              file "dist/${STEM}.AppImage" | grep -q 'ELF'
              scripts/check-appimage-libraries.sh "dist/${STEM}.AppImage"
              file "dist/agentum-desktop-${VER}-${OSARCH}" | grep -q 'ELF'
              file "dist/agentum-sdd-worker-${VER}-${OSARCH}" | grep -q 'ELF'
              test "$("dist/agentum-sdd-worker-${VER}-${OSARCH}" --version)" = \
                "agentum-sdd-worker ${VER} protocol=1"
              ;;
            x86_64-pc-windows-msvc)
              test -s "dist/${STEM}-setup.exe"
              test -s "dist/${STEM}-setup.exe.sig"
              file "dist/${STEM}-setup.exe" | grep -Eq 'PE32\+? executable'
              ;;
          esac
          ls -la dist/

      - name: Verify canonical Linux AppImage installation
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          export AGENTUM_INSTALL_SOURCE_ONLY=1
          source scripts/install.sh
          install_root="$RUNNER_TEMP/agentum-linux-install-contract"
          TEMP_DIR="$install_root/temp"
          INSTALL_DIR="$install_root/bin"
          LINUX_APPLICATIONS_DIR="$install_root/share/applications"
          LINUX_ICON_DIR="$install_root/share/icons/hicolor/256x256/apps"
          mkdir -p "$TEMP_DIR"
          ver="$(jq -r '.version' crates/agentum-desktop/tauri.conf.json)"
          appimage="$GITHUB_WORKSPACE/dist/agentum-${ver}-linux-x64.AppImage"
          install_linux_appimage "$appimage"
          cmp "$appimage" "$INSTALL_DIR/agentum-desktop"
          test -s "$LINUX_ICON_DIR/agentum-desktop.png"
          grep -Fqx "Exec=\"$INSTALL_DIR/agentum-desktop\"" \
            "$LINUX_APPLICATIONS_DIR/dev.agentum.app.desktop"

      - name: Scan generated bundles for restricted content
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          RESTRICTED_PATTERNS: ${{ secrets.AGENTUM_RESTRICTED_PATTERNS }}
        run: |
          set -euo pipefail
          test -n "$RESTRICTED_PATTERNS"
          patterns="$(mktemp)"
          chmod 600 "$patterns"
          trap 'rm -f -- "$patterns"' EXIT
          printf '%s\n' "$RESTRICTED_PATTERNS" > "$patterns"
          bundle_dir="target/$BUILD_TARGET/release/bundle"
          test -d "$bundle_dir"
          scripts/check-restricted-content.sh "$patterns" dist "$bundle_dir"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          # Installer globs match only on targets that built them. The combined
          # set is never empty, so `error` is safe.
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/*.sig
            dist/agentum-desktop-*
            dist/agentum-sdd-worker-*
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: verify complete release staging
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Resolve version-matched release identity
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' crates/agentum-desktop/tauri.conf.json)"
          tag="v${version}"
          if [[ "$PUBLISH" == "true" ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
            tag="$GITHUB_REF_NAME"
          fi
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"

      - name: Stage installer + uninstaller
        run: |
          set -eux
          # Attached to the release so `…/releases/latest/download/install.sh`
          # and …/uninstall.sh work (the README's recommended one-liners).
          cp scripts/install.sh dist/install.sh
          cp scripts/uninstall.sh dist/uninstall.sh

      - name: Create deterministic source package from the verified commit
        shell: bash
        run: |
          set -euo pipefail
          ver="$RELEASE_VERSION"
          git archive --format=tar --prefix="agentum-${ver}/" HEAD \
            | gzip -n > "dist/agentum-${ver}-source.tar.gz"
          test -s "dist/agentum-${ver}-source.tar.gz"
          tar -tzf "dist/agentum-${ver}-source.tar.gz" >/dev/null

      - name: Validate complete release asset roster
        shell: bash
        run: |
          set -euo pipefail
          ver="$RELEASE_VERSION"
          expected="$(mktemp)"
          actual="$(mktemp)"
          trap 'rm -f -- "$expected" "$actual"' EXIT
          printf '%s\n' \
            "agentum-${ver}-windows-x64-setup.exe" \
            "agentum-${ver}-windows-x64-setup.exe.sig" \
            "agentum-${ver}-linux-x64.deb" \
            "agentum-${ver}-linux-x64.rpm" \
            "agentum-${ver}-linux-x64.AppImage" \
            "agentum-${ver}-linux-x64.AppImage.sig" \
            "agentum-desktop-${ver}-linux-x64" \
            "agentum-sdd-worker-${ver}-linux-x64" \
            "agentum-${ver}-source.tar.gz" \
            install.sh uninstall.sh | LC_ALL=C sort > "$expected"
          find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$actual"
          if ! diff -u "$expected" "$actual"; then
            echo "unexpected release asset roster" >&2
            exit 1
          fi
          while IFS= read -r asset; do
            test -s "dist/$asset" || {
              echo "empty required release asset: $asset" >&2
              exit 1
            }
          done < "$expected"

      - name: Reject retired release payloads
        shell: bash
        run: |
          set -euo pipefail
          retired="$(find dist -mindepth 1 -maxdepth 1 \
            \( -name '*.dmg' -o -name '*.app' -o -name '*.app.tar.gz' \
               -o -name '*.app.tar.gz.sig' -o -name '*apple-darwin*' \
               -o -name 'macos-*' -o -name '*-macos-*' \) -print)"
          if [[ -n "$retired" ]]; then
            printf 'retired release payload detected:\n%s\n' "$retired" >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1

      - name: Install pinned Gitleaks
        run: |
          scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Install pinned Ripgrep
        shell: bash
        run: |
          scripts/install-ripgrep.sh "$RUNNER_TEMP/ripgrep-bin"
          printf '%s\n' "$RUNNER_TEMP/ripgrep-bin" >> "$GITHUB_PATH"

      - name: Verify every updater signature against the embedded key
        shell: bash
        run: |
          set -euo pipefail
          ver="$RELEASE_VERSION"
          for artifact in \
            "agentum-${ver}-windows-x64-setup.exe" \
            "agentum-${ver}-linux-x64.AppImage"; do
            cargo run --locked --quiet -p agentum-core \
              --bin agentum-updater-verify -- \
              crates/agentum-desktop/tauri.conf.json \
              "dist/$artifact" \
              "dist/$artifact.sig"
          done

      - name: Generate sha256 sums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name '*.sig' ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          test -s dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          set -eux
          ver="$RELEASE_VERSION"
          # Pull the section for this version out of CHANGELOG.md
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          echo "----"
          cat release-notes.md

      - name: Build updater manifest (latest.json)
        shell: bash
        # The Tauri updater fetches this from the `endpoints` URL
        # (…/releases/latest/download/latest.json). Each platform entry carries the
        # release-asset URL of the signed updater bundle plus its detached
        # signature (the .sig file's contents). Every supported platform is
        # required; a missing updater blocks publication.
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eux
          ver="$RELEASE_VERSION"
          base="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"
          pubdate="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          platforms='{}'
          emit() {
            key="$1"; asset="$2"; sigf="dist/${asset}.sig"
            test -s "dist/$asset"
            test -s "$sigf"
            platforms="$(jq --arg k "$key" --arg url "${base}/${asset}" --rawfile sig "$sigf" \
              '. + {($k): {signature: ($sig | rtrimstr("\n")), url: $url}}' <<<"$platforms")"
          }
          emit windows-x86_64 "agentum-${ver}-windows-x64-setup.exe"
          emit linux-x86_64   "agentum-${ver}-linux-x64.AppImage"
          jq -n --arg v "$ver" --arg d "$pubdate" --rawfile n release-notes.md --argjson p "$platforms" \
            '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > dist/latest.json
          cat dist/latest.json

          test "$(jq '.platforms | length' dist/latest.json)" -eq 2
          test "$(jq -r '.platforms | keys | sort | join(",")' dist/latest.json)" = \
            "linux-x86_64,windows-x86_64"

      - name: Scan source package and final release staging
        shell: bash
        env:
          RESTRICTED_PATTERNS: ${{ secrets.AGENTUM_RESTRICTED_PATTERNS }}
        run: |
          set -euo pipefail
          test -n "$RESTRICTED_PATTERNS"
          ver="$RELEASE_VERSION"
          patterns="$(mktemp)"
          source_scan="$(mktemp -d)"
          chmod 600 "$patterns"
          trap 'rm -f -- "$patterns"; rm -rf -- "$source_scan"' EXIT
          printf '%s\n' "$RESTRICTED_PATTERNS" > "$patterns"
          tar -xzf "dist/agentum-${ver}-source.tar.gz" -C "$source_scan"
          scripts/check-restricted-content.sh \
            "$patterns" "$source_scan" dist release-notes.md
          gitleaks dir --no-banner --redact --exit-code 1 "$source_scan"
          gitleaks dir --no-banner --redact --exit-code 1 dist

      - name: Upload verified release staging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-staging
          path: |
            dist
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  release:
    name: create private GitHub release draft
    # Publication authority exists only for an explicitly requested signed tag.
    if: inputs.publish && startsWith(github.ref, 'refs/tags/')
    needs: aggregate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-staging
          path: verified
      - name: Create private GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s verified/release-notes.md
          test -s verified/dist/latest.json
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes-file verified/release-notes.md \
            verified/dist/*

  publish:
    name: publish verified release
    if: inputs.publish && startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Changes the verified draft to a public release.
    steps:
      - name: Publish draft and mark latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
